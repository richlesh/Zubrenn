name: Build and Release Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. 1.0.0)"
        required: true

# Serialize all release workflows for the SAME version so the shared git tag and
# draft release are created exactly once (no duplicate drafts across the
# mac/linux/windows dispatches, and no intra-matrix race).
concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  # Create the git tag ONCE (idempotent) so the draft release is keyed to a real
  # tag. A draft keyed to an existing tag is found and reused by every later
  # job/workflow, which is what prevents duplicate draft releases.
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          RAW="${{ inputs.tag }}"
          VERSION="${RAW#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version provided (inputs.tag is empty)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Create tag if missing
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin — reusing it."
          else
            echo "Creating tag $TAG at ${{ github.sha }}"
            git tag "$TAG" "${{ github.sha }}"
            git push origin "refs/tags/$TAG"
          fi

      - name: Ensure draft release exists
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Zubrenn ${{ steps.ver.outputs.version }}
          draft: true

  build-linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          ACTUAL="$(node -p "require('./package.json').version")"
          echo "package.json version is now: $ACTUAL"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::Version mismatch: expected $VERSION but package.json is $ACTUAL."
            exit 1
          fi

      - name: Install ARM64 cross-compilation tools
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Inject license salt
        run: |
          echo "const LICENSE_SALT = \"${{ secrets.LICENSE_SALT }}\";" > src/license.cjs
          echo "module.exports = { LICENSE_SALT };" >> src/license.cjs

      - name: Build Linux ${{ matrix.arch }}
        run: ./node_modules/.bin/electron-builder --linux --${{ matrix.arch }} --publish never

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: Zubrenn ${{ needs.prepare-release.outputs.version }}
          draft: true
          files: |
            dist/*.deb
            dist/*.rpm
