<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nexus Data Core</title>
  <style>
    /* ----- Theme variables (light default; .dark overrides) ------------- */
    :root {
      --bg: #f5f5f5;
      --panel-bg: #ffffff;
      --toc-bg: #ececec;
      --fg: #1e1e1e;
      --muted: #666;
      --border: #d0d0d0;
      --link: #0a66d6;
      --accent: #0a84ff;
      --code-bg: #f0f0f0;
      --table-head: #e8e8e8;
      --table-stripe: #f6f6f6;
      --quote-bar: #c6c6c6;
    }
    body.dark {
      --bg: #1a1a1a;
      --panel-bg: #202020;
      --toc-bg: #161616;
      --fg: #e0e0e0;
      --muted: #a0a0a0;
      --border: #3a3a3a;
      --link: #4da3ff;
      --accent: #4da3ff;
      --code-bg: #2a2a2a;
      --table-head: #2b2b2b;
      --table-stripe: #242424;
      --quote-bar: #444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }

    #layout { display: flex; flex: 1; min-height: 0; }

    /* Narrow left Table of Contents panel. */
    #toc {
      width: 260px;
      min-width: 180px;
      max-width: 420px;
      flex: 0 0 auto;
      background: var(--toc-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 18px 16px;
    }
    /* Right content panel. */
    #content {
      flex: 1;
      min-width: 0;
      background: var(--panel-bg);
    }
    /* The content column holds a scrolling markdown area plus a pinned find
       bar at the bottom. */
    #content { display: flex; flex-direction: column; }
    #content .md {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 32px;
    }

    /* ----- Rendered markdown styling (shared by both panels) ------------ */
    .md { line-height: 1.6; font-size: 15px; }
    .md h1 { font-size: 1.7em; margin: 0.2em 0 0.5em; font-weight: 650; }
    .md h2 { font-size: 1.4em; margin: 1.1em 0 0.5em; font-weight: 640; border-bottom: 1px solid var(--border); padding-bottom: 0.2em; }
    .md h3 { font-size: 1.18em; margin: 1em 0 0.4em; font-weight: 620; }
    .md h4 { font-size: 1.05em; margin: 0.9em 0 0.35em; font-weight: 620; }
    .md p { margin: 0.6em 0; }
    .md ul, .md ol { margin: 0.5em 0 0.5em 1.4em; }
    .md li { margin: 0.25em 0; }
    .md a { color: var(--link); text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md code {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.9em;
      background: var(--code-bg);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    .md pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 0.7em 0; }
    .md pre code { background: none; padding: 0; }
    .md blockquote {
      margin: 0.7em 0;
      padding: 0.2em 0 0.2em 1em;
      border-left: 3px solid var(--quote-bar);
      color: var(--muted);
    }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }
    .md img { max-width: 128px; height: auto; vertical-align: middle; border-radius: 6px; }
    /* Right/left-floated thumbnails (content pages wrap building/terrain icons
       in <span class="float-right">…</span>). The paragraph that holds the span
       is floated so the following text wraps around the image. */
    .md .float-right { float: right; margin: 0 0 0.6em 1em; }
    .md .float-left { float: left; margin: 0 1em 0.6em 0; }
    /* Headings and horizontal rules start a new row below any floated image. */
    .md h1, .md h2, .md h3, .md h4, .md hr { clear: both; }
    .md table { border-collapse: collapse; margin: 0.8em 0; width: 100%; }
    .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
    .md th { background: var(--table-head); font-weight: 620; }
    .md tbody tr:nth-child(even) { background: var(--table-stripe); }

    /* TOC panel: slightly tighter, left-aligned list of page links. */
    #toc .md { font-size: 14px; }
    #toc .md h1 { font-size: 1.3em; }
    #toc .md h2 { font-size: 1.05em; border: none; }

    /* The currently loaded page is highlighted in the TOC. */
    #toc a.active { font-weight: 700; color: var(--accent); }

    #error { color: #d04545; padding: 20px; }
    body.dark #error { color: #ff8a8a; }

    /* Click-to-enlarge lightbox for Nexus images. Content images show a
       zoom-in cursor; clicking one opens a full-screen overlay with the image
       enlarged, dimming the rest of the dialog. Click anywhere or press Esc to
       close. */
    #content .md img { cursor: zoom-in; }
    #nexus-lightbox {
      position: fixed;
      inset: 0;
      z-index: 10050;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.82);
      cursor: zoom-out;
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    #nexus-lightbox.open { display: flex; opacity: 1; }
    #nexus-lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      /* Override the 128px cap that .md img imposes so thumbnails enlarge. */
      object-fit: contain;
      image-rendering: auto;
    }

    /* ----- In-page find bar (bottom of the content panel) ----------------- */
    #find-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-top: 1px solid var(--border);
      background: var(--toc-bg);
      font-size: 13px;
    }
    #find-bar .find-icon { color: var(--muted); flex: 0 0 auto; display: flex; }
    #find-input {
      flex: 1;
      min-width: 0;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-bg);
      color: var(--fg);
      font-size: 13px;
      outline: none;
    }
    #find-input:focus { border-color: var(--accent); }
    #find-count {
      flex: 0 0 auto;
      color: var(--muted);
      min-width: 54px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    #find-bar button {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-bg);
      color: var(--fg);
      cursor: pointer;
      line-height: 1;
    }
    #find-bar button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    #find-bar button:disabled { opacity: 0.4; cursor: default; }
    /* Search-match highlights injected into the content. */
    #content mark.find-hit { background: #ffe066; color: #1e1e1e; border-radius: 2px; }
    #content mark.find-hit.current { background: #ff9d2e; color: #1e1e1e; }
    body.dark #content mark.find-hit { background: #6b5a1a; color: #fff; }
    body.dark #content mark.find-hit.current { background: #c77b1a; color: #fff; }
  </style>
</head>
<body>
  <div id="layout">
    <nav id="toc"><div class="md"></div></nav>
    <section id="content">
      <div class="md"></div>
      <div id="find-bar">
        <span class="find-icon" title="Search this page">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input id="find-input" type="text" placeholder="Search this page…" aria-label="Search this page" spellcheck="false" autocomplete="off">
        <span id="find-count">0/0</span>
        <button id="find-prev" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled>&#9650;</button>
        <button id="find-next" type="button" title="Next match (Enter)" aria-label="Next match" disabled>&#9660;</button>
      </div>
    </section>
  </div>

  <!-- Click-to-enlarge overlay for Nexus images (populated/toggled from JS). -->
  <div id="nexus-lightbox"><img alt=""></div>

  <script>
    const { ipcRenderer } = require("electron");
    const fs = require("fs");
    const path = require("path");

    // Directory holding the Nexus markdown pages and the project root used to
    // resolve README-relative image paths like "src/resources/...".
    const NEXUS_DIR = path.join(__dirname, "resources", "nexus");
    const PROJECT_ROOT = path.join(__dirname, "..");

    const tocEl = document.querySelector("#toc .md");
    const contentEl = document.querySelector("#content .md");

    // -------------------- theme / font size --------------------
    const FONT_SCALES = { small: 1, medium: 1.25, large: 1.5 };
    function applySettings(settings) {
      settings = settings || {};
      document.body.classList.toggle("dark", (settings.theme || "dark") === "dark");
      document.body.style.zoom = String(FONT_SCALES[settings.fontSize || "small"] || 1);
    }
    function refreshSettings() {
      ipcRenderer.invoke("settings-get").then(applySettings).catch(() => {});
    }
    // Live-update when Settings are saved elsewhere.
    ipcRenderer.on("settings-updated", refreshSettings);

    // -------------------- markdown renderer --------------------
    // Rendering is handled by markdown-it (CommonMark + GFM tables) plus
    // markdown-it-attrs for Pandoc-style attribute blocks (e.g. image sizing
    // `{width=128}`). Two custom renderer rules adapt output for this offline
    // Electron dialog: image `src` values are rewritten to absolute file:// URLs,
    // and links are classified as internal (another .md page, loaded into the
    // content panel) or external (opened in the system browser).

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Resolve an image/link href that may be README-relative (e.g.
    // "src/resources/aliens/128/X.png") to an absolute file URL so it loads
    // inside this dialog regardless of the page's own location.
    function resolveAssetUrl(src) {
      if (/^(https?:|data:|file:)/i.test(src)) return src;
      let abs;
      if (path.isAbsolute(src)) abs = src;
      else if (/^src[\\/]/.test(src)) abs = path.join(PROJECT_ROOT, src);
      else abs = path.join(NEXUS_DIR, src); // relative to the page
      return "file://" + abs.split(path.sep).join("/");
    }

    const MarkdownIt = require("markdown-it");
    const mdAttrs = require("markdown-it-attrs");
    // html:true lets the content pages' raw <span class="float-right"> wrappers
    // pass through; linkify turns bare URLs into links; typographer off keeps
    // text verbatim. markdown-it-attrs enables {width=128} etc. on images.
    const md = new MarkdownIt({ html: true, linkify: true, typographer: false }).use(mdAttrs);

    // Image rule: rewrite the resolved src to a file:// URL (README-relative
    // src/resources/... paths), preserving any attributes markdown-it-attrs set
    // (e.g. width/height). Falls back to markdown-it's default token rendering
    // for everything else.
    md.renderer.rules.image = function (tokens, idx, options, env, self) {
      const token = tokens[idx];
      const srcIdx = token.attrIndex("src");
      if (srcIdx >= 0) token.attrs[srcIdx][1] = resolveAssetUrl(token.attrs[srcIdx][1]);
      // Keep the alt text markdown-it parsed into the token's children
      // (self.renderToken alone would emit an empty alt="").
      const altIdx = token.attrIndex("alt");
      const altText = self.renderInlineAsText(token.children || [], options, env);
      if (altIdx >= 0) token.attrs[altIdx][1] = altText;
      else token.attrSet("alt", altText);
      return self.renderToken(tokens, idx, options);
    };

    // Link rule: classify links. An internal link (another .md page, or any
    // non-absolute-URL href) is marked with data-md and neutralized href="#" so
    // the panel-swap click handler loads it; external http(s) links are left for
    // the system browser. Applied by overriding link_open.
    const _defaultLinkOpen = md.renderer.rules.link_open ||
      function (tokens, idx, options, env, self) { return self.renderToken(tokens, idx, options); };
    md.renderer.rules.link_open = function (tokens, idx, options, env, self) {
      const token = tokens[idx];
      const hrefIdx = token.attrIndex("href");
      const href = hrefIdx >= 0 ? token.attrs[hrefIdx][1] : "";
      const internal = /\.md($|[#?])/i.test(href) || !/^[a-z]+:/i.test(href);
      if (internal) {
        token.attrSet("data-md", href);
        if (hrefIdx >= 0) token.attrs[hrefIdx][1] = "#";
      }
      return _defaultLinkOpen(tokens, idx, options, env, self);
    };

    function renderMarkdown(src) {
      return md.render(String(src == null ? "" : src));
    }

    // -------------------- page loading --------------------
    function readPage(name) {
      const file = path.join(NEXUS_DIR, name);
      return fs.readFileSync(file, "utf8");
    }

    let currentPage = null;
    function loadContent(name) {
      try {
        const md = readPage(name);
        contentEl.innerHTML = renderMarkdown(md);
        contentEl.parentElement.scrollTop = 0;
        currentPage = name;
        highlightActive();
        // New page: drop any prior search highlights and re-apply the current
        // query (if the find field still holds text) against the new content.
        if (typeof clearFindHighlights === "function") { clearFindHighlights(); }
        if (typeof runFind === "function" && findInput && findInput.value.trim()) { runFind(false); }
        else if (typeof updateFindUI === "function") { updateFindUI(); }
      } catch (err) {
        contentEl.innerHTML = '<div id="error">Could not load <code>' +
          escapeHtml(name) + '</code>:<br>' + escapeHtml(String(err && err.message || err)) + '</div>';
      }
    }

    function highlightActive() {
      tocEl.querySelectorAll('a[data-md]').forEach((a) => {
        a.classList.toggle("active", a.getAttribute("data-md") === currentPage);
      });
    }

    // Clicks inside either panel: internal .md links swap the content panel;
    // external links open in the system browser.
    function wireLinks(container) {
      container.addEventListener("click", (e) => {
        const a = e.target.closest("a");
        if (!a) return;
        e.preventDefault();
        const md = a.getAttribute("data-md");
        if (md) {
          // Strip any trailing #anchor/?query for the filename.
          const name = md.replace(/[#?].*$/, "");
          loadContent(name);
        } else {
          const href = a.getAttribute("href");
          if (href && /^https?:/i.test(href)) ipcRenderer.invoke("open-external", href);
        }
      });
    }
    wireLinks(tocEl);
    wireLinks(contentEl);

    // -------------------- image lightbox --------------------
    // Clicking any rendered image enlarges it in a full-screen overlay. The
    // content images are 128px thumbnails from a `/128/` folder; when a
    // full-size sibling (the same file without the `/128` segment) exists on
    // disk, show that for a crisper enlargement, else fall back to the thumb.
    const lightbox = document.getElementById("nexus-lightbox");
    const lightboxImg = lightbox ? lightbox.querySelector("img") : null;
    function fullResUrl(fileUrl) {
      try {
        if (!/^file:\/\//i.test(fileUrl)) return fileUrl;
        const p = decodeURIComponent(fileUrl.replace(/^file:\/\//i, ""));
        const alt = p.replace(/\/128\//, "/");
        if (alt !== p && fs.existsSync(alt)) {
          return "file://" + alt.split(path.sep).join("/");
        }
      } catch (e) { /* fall through to the original */ }
      return fileUrl;
    }
    function openLightbox(src) {
      if (!lightbox || !lightboxImg) return;
      lightboxImg.src = fullResUrl(src);
      lightbox.classList.add("open");
    }
    function closeLightbox() {
      if (!lightbox) return;
      lightbox.classList.remove("open");
      if (lightboxImg) lightboxImg.removeAttribute("src");
    }
    function wireImages(container) {
      container.addEventListener("click", (e) => {
        const img = e.target.closest("img");
        if (!img || !container.contains(img)) return;
        e.preventDefault();
        e.stopPropagation();
        openLightbox(img.getAttribute("src"));
      });
    }
    wireImages(tocEl);
    wireImages(contentEl);
    if (lightbox) lightbox.addEventListener("click", closeLightbox);

    // -------------------- in-page find --------------------
    // A find bar at the bottom of the content panel searches the currently
    // loaded page: it highlights every case-insensitive match, shows a
    // current/total count, and the up/down arrows (or Shift+Enter / Enter) jump
    // between matches. Highlights are cleared whenever a new page loads.
    const findInput = document.getElementById("find-input");
    const findCount = document.getElementById("find-count");
    const findPrev = document.getElementById("find-prev");
    const findNext = document.getElementById("find-next");
    let findHits = [];     // the <mark.find-hit> elements, in document order
    let findIndex = -1;    // index of the current (focused) match

    // Remove all highlight wrappers, restoring the original text runs.
    function clearFindHighlights() {
      const marks = contentEl.querySelectorAll("mark.find-hit");
      for (const m of marks) {
        const parent = m.parentNode;
        if (!parent) continue;
        parent.replaceChild(document.createTextNode(m.textContent), m);
        parent.normalize();
      }
      findHits = [];
      findIndex = -1;
    }

    function updateFindUI() {
      const total = findHits.length;
      findCount.textContent = total ? `${findIndex + 1}/${total}` : "0/0";
      findPrev.disabled = total === 0;
      findNext.disabled = total === 0;
    }

    function setCurrentMatch(i, scroll) {
      if (!findHits.length) return;
      if (findIndex >= 0 && findHits[findIndex]) findHits[findIndex].classList.remove("current");
      findIndex = ((i % findHits.length) + findHits.length) % findHits.length;
      const el = findHits[findIndex];
      el.classList.add("current");
      if (scroll) el.scrollIntoView({ block: "center", behavior: "smooth" });
      updateFindUI();
    }

    // Wrap every case-insensitive occurrence of `query` in the content's text
    // nodes with <mark class="find-hit">. Skips text already inside a mark and
    // inside script/style. Collects the created marks into findHits.
    function highlightMatches(query) {
      const q = query.toLowerCase();
      const walker = document.createTreeWalker(contentEl, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          const p = node.parentNode;
          if (!p) return NodeFilter.FILTER_REJECT;
          const tag = p.nodeName;
          if (tag === "SCRIPT" || tag === "STYLE" || tag === "MARK") return NodeFilter.FILTER_REJECT;
          return node.nodeValue.toLowerCase().includes(q) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
      });
      const targets = [];
      let n;
      while ((n = walker.nextNode())) targets.push(n);
      for (const node of targets) {
        const text = node.nodeValue;
        const lower = text.toLowerCase();
        const frag = document.createDocumentFragment();
        let pos = 0, hit;
        while ((hit = lower.indexOf(q, pos)) !== -1) {
          if (hit > pos) frag.appendChild(document.createTextNode(text.slice(pos, hit)));
          const mark = document.createElement("mark");
          mark.className = "find-hit";
          mark.textContent = text.slice(hit, hit + q.length);
          frag.appendChild(mark);
          findHits.push(mark);
          pos = hit + q.length;
        }
        if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
        node.parentNode.replaceChild(frag, node);
      }
    }

    // Re-run the search for the current input value (clearing prior highlights).
    function runFind(keepIndex) {
      const prev = findIndex;
      clearFindHighlights();
      const query = (findInput.value || "").trim();
      if (query.length) {
        highlightMatches(query);
      }
      if (findHits.length) {
        const start = (keepIndex && prev >= 0) ? Math.min(prev, findHits.length - 1) : 0;
        setCurrentMatch(start, true);
      } else {
        updateFindUI();
      }
    }

    findInput.addEventListener("input", () => runFind(false));
    findInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        if (findHits.length) setCurrentMatch(findIndex + (e.shiftKey ? -1 : 1), true);
      } else if (e.key === "Escape") {
        e.preventDefault();
        if (findInput.value) { findInput.value = ""; runFind(false); }
        else { findInput.blur(); }
        e.stopPropagation();
      }
    });
    findPrev.addEventListener("click", () => setCurrentMatch(findIndex - 1, true));
    findNext.addEventListener("click", () => setCurrentMatch(findIndex + 1, true));

    // -------------------- init --------------------
    refreshSettings();
    tocEl.innerHTML = (() => {
      try { return renderMarkdown(readPage("index.md")); }
      catch (err) { return '<div id="error">Missing index.md</div>'; }
    })();
    highlightActive();
    // Open the How to Play page by default (fall back to index if absent).
    try { readPage("how_to_play.md"); loadContent("how_to_play.md"); }
    catch { loadContent("index.md"); }

    // Close on Escape or Cmd/Ctrl+W.
    window.addEventListener("keydown", (e) => {
      // Cmd/Ctrl+F focuses the page-find field.
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") {
        e.preventDefault();
        findInput.focus();
        findInput.select();
        return;
      }
      // Esc closes an open lightbox first; otherwise it closes the dialog.
      if (e.key === "Escape" && lightbox && lightbox.classList.contains("open")) {
        closeLightbox();
        return;
      }
      // While typing in the find field, let its own handler manage Esc
      // (clear/blur) instead of closing the whole dialog.
      if (e.key === "Escape" && document.activeElement === findInput) {
        return;
      }
      if (e.key === "Escape" || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "w")) {
        ipcRenderer.invoke("close-nexus");
      }
    });
  </script>
</body>
</html>
