<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- quadcopter, plan view: central body -->
  <rect x="52" y="52" width="24" height="24" rx="4"/>
  <!-- arms to four rotors -->
  <line x1="52" y1="52" x2="30" y2="30"/>
  <line x1="76" y1="52" x2="98" y2="30"/>
  <line x1="52" y1="76" x2="30" y2="98"/>
  <line x1="76" y1="76" x2="98" y2="98"/>
  <!-- rotors -->
  <circle cx="26" cy="26" r="14"/>
  <circle cx="102" cy="26" r="14"/>
  <circle cx="26" cy="102" r="14"/>
  <circle cx="102" cy="102" r="14"/>
</svg>
